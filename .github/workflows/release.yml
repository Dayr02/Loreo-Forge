name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v
      - name: Export Godot placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\godot_export | Out-Null
          "placeholder" | Set-Content build\godot_export\README.txt
      - name: Build PyInstaller package
        run: pyinstaller build/loreo_forge.spec
      - name: Create installer placeholder
        shell: pwsh
        run: |
          "placeholder installer" | Set-Content build\LoreoForgeSetup.exe
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/LoreoForgeSetup.exe
